<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Monthly Analytics Report</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <h1>Monthly Analytics Report</h1>
  <p>Sample data for practice. Replace with real numbers later.</p>

  <div class="summary-box">
    <div class="summary-label">Total Revenue</div>
    <div class="summary-value">$435,000</div>
  </div>

  <h2>Sales by Region</h2>
  <table>
    <thead>
      <tr>
        <th>Region</th>
        <th>Revenue</th>
        <th>Target</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>NSW</td>
        <td>$120,000</td>
        <td>$100,000</td>
        <td><span class="on-track">On track</span></td>
      </tr>
      <tr>
        <td>Victoria</td>
        <td>$95,000</td>
        <td>$100,000</td>
        <td><span class="behind">Behind</span></td>
      </tr>
      <tr>
        <td>Queensland</td>
        <td>$110,000</td>
        <td>$105,000</td>
        <td><span class="on-track">On track</span></td>
      </tr>
      <tr>
        <td>Western Australia</td>
        <td>$85,000</td>
        <td>$90,000</td>
        <td><span class="at-risk">At risk</span></td>
      </tr>
    </tbody>
  </table>

</body>
</html>
